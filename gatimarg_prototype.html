<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GatiMarg AI — Urban Traffic Flow, Incident Intelligence & Festive Mobility Platform</title>
  <meta name="description"
    content="GatiMarg AI: An AI-driven traffic management, multi-horizon forecasting, spillback tracking, and cultural event mobility platform engineered for Hyderabad metropolitan corridors.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;600&display=swap"
    rel="stylesheet">
  <style>
    /* =========================================================================
       GATIMARG AI — DESIGN SYSTEM (Sleek Urban Command Dark / Slate Palette)
       ========================================================================= */
    :root {
      /* Backgrounds & Surfaces */
      --bg-dark: #090D16;
      --bg-card: #0F172A;
      --bg-card-hover: #162238;
      --surface-subtle: #1E293B;
      --surface-border: #334155;
      --border-bright: #475569;

      /* Text Colors */
      --text-main: #F8FAFC;
      --text-secondary: #94A3B8;
      --text-muted: #64748B;

      /* Primary Brand / Flow: Electric Cyan & Tech Indigo */
      --brand-primary: #06B6D4;
      --brand-glow: rgba(6, 182, 212, 0.25);
      --brand-accent: #3B82F6;
      --brand-dark: #0E7490;

      /* Festive & Amber Shocks */
      --festive-gold: #F59E0B;
      --festive-glow: rgba(245, 158, 11, 0.22);
      --festive-bg: #451A03;
      --festive-border: #B45309;

      /* Status Colors */
      --status-green: #10B981;
      --status-red: #EF4444;
      --status-yellow: #EAB308;
      --status-purple: #8B5CF6;

      /* Radii & Shadows */
      --r-sm: 6px;
      --r-md: 12px;
      --r-lg: 18px;
      --r-full: 9999px;
      --shadow-card: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);

      /* Typography */
      --font-sans: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      --font-display: 'Space Grotesk', system-ui, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: var(--font-sans);
      background-color: var(--bg-dark);
      color: var(--text-main);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      min-height: 100vh;
    }

    h1,
    h2,
    h3,
    h4 {
      font-family: var(--font-display);
      letter-spacing: -0.02em;
    }

    /* ---- TOP SYSTEM BAR ---- */
    .system-bar {
      background: #050811;
      border-bottom: 1px solid var(--surface-border);
      padding: 6px 24px;
      font-size: 11px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--text-secondary);
      flex-wrap: wrap;
      gap: 8px;
    }

    .badge-live {
      background: rgba(16, 185, 129, 0.15);
      color: #34D399;
      border: 1px solid rgba(16, 185, 129, 0.3);
      padding: 2px 8px;
      border-radius: var(--r-full);
      font-weight: 700;
      font-size: 10px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .pulse-dot {
      width: 6px;
      height: 6px;
      background: #10B981;
      border-radius: 50%;
      box-shadow: 0 0 8px #10B981;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(1.3); }
    }

    /* ---- APP HEADER & TWO-TIER RESPONSIVE ARCHITECTURE ---- */
    .app-header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(10, 15, 29, 0.95);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--surface-border);
      padding: 8px 24px 8px 24px;
      display: flex;
      flex-direction: column;
      gap: 7px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.45);
      transition: all 0.25s ease;
    }

    .header-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      width: 100%;
    }

    .logo-container {
      display: flex;
      align-items: center;
      gap: 11px;
      cursor: pointer;
      user-select: none;
      flex-shrink: 0;
    }

    .logo-badge {
      width: 38px;
      height: 38px;
      border-radius: 9px;
      background: linear-gradient(135deg, #06B6D4, #3B82F6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 19px;
      box-shadow: 0 0 16px var(--brand-glow);
      flex-shrink: 0;
    }

    .logo-title {
      font-family: var(--font-display);
      font-size: 19px;
      font-weight: 700;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 6px;
      line-height: 1.2;
    }

    .logo-title span {
      font-size: 9.5px;
      background: rgba(6, 182, 212, 0.2);
      color: #38BDF8;
      border: 1px solid rgba(6, 182, 212, 0.4);
      padding: 1.5px 5.5px;
      border-radius: 4px;
      font-family: var(--font-mono);
      font-weight: 600;
    }

    .logo-sub {
      font-size: 10.5px;
      color: var(--text-secondary);
      line-height: 1.2;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    /* ---- ROLE-BASED ACCESS CONTROL (RBAC) STYLES ---- */
    .role-selector-bar {
      display: flex;
      align-items: center;
      background: #070C18;
      border: 1px solid var(--surface-border);
      border-radius: var(--r-full);
      padding: 3px 5px;
      gap: 3px;
    }

    .role-pill {
      background: transparent;
      border: none;
      color: var(--text-secondary);
      font-size: 11px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: var(--r-full);
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
    }

    .role-pill:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.06);
    }

    .role-pill.active {
      background: linear-gradient(135deg, #0284C7, #06B6D4);
      color: #fff;
      box-shadow: 0 0 12px rgba(6, 182, 212, 0.35);
    }

    /* ---- NAVIGATION ROW & ADMIN 4-ABOVE / 3-BELOW ARCHITECTURE ---- */
    .header-nav-row {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
    }

    .nav-tabs-wrapper {
      width: 100%;
      display: flex;
      justify-content: center;
    }

    /* Admin 2-Tier Stack: 4 Above, 3 Below */
    .admin-nav-cluster {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      width: 100%;
      max-width: 980px;
    }

    .admin-nav-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      background: #080D1A;
      border: 1px solid var(--surface-border);
      border-radius: var(--r-full);
      padding: 3px 6px;
      max-width: 100%;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .admin-nav-row::-webkit-scrollbar {
      display: none;
    }

    .admin-nav-row-top {
      border-color: rgba(56, 189, 248, 0.25);
    }

    .admin-nav-row-bottom {
      border-color: rgba(129, 140, 248, 0.22);
      background: rgba(8, 13, 26, 0.7);
    }

    /* Standard Single Row for User & Authority */
    .standard-nav-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      background: #080D1A;
      border: 1px solid var(--surface-border);
      border-radius: var(--r-full);
      padding: 3px 6px;
      max-width: 100%;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .standard-nav-row::-webkit-scrollbar {
      display: none;
    }

    .nav-tab {
      padding: 5px 13px;
      border-radius: var(--r-full);
      font-size: 11.5px;
      font-weight: 600;
      color: var(--text-secondary);
      border: 1px solid transparent;
      background: none;
      cursor: pointer;
      transition: all 0.18s cubic-bezier(0.16, 1, 0.3, 1);
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      flex-shrink: 0;
    }

    .nav-tab:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.06);
      border-color: rgba(255, 255, 255, 0.08);
    }

    .nav-tab.active {
      background: linear-gradient(135deg, #0284C7, #06B6D4);
      color: #fff;
      border-color: rgba(56, 189, 248, 0.5);
      box-shadow: 0 2px 10px rgba(6, 182, 212, 0.35);
    }

    /* ---- CITIZEN ROUTE CHECKER STYLES ---- */
    .route-input-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
      margin-bottom: 12px;
    }

    .route-input-label {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .route-input {
      width: 100%;
      background: #070B14;
      border: 1.5px solid var(--surface-border);
      border-radius: 8px;
      padding: 9px 12px;
      color: #fff;
      font-size: 13px;
      font-family: var(--font-sans);
      transition: all 0.2s;
    }

    .route-input:focus {
      outline: none;
      border-color: #06B6D4;
      box-shadow: 0 0 0 3px rgba(6, 182, 212, 0.2);
    }

    .preset-chips-container {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 12px 0 16px;
    }

    .preset-chip {
      background: #0B1222;
      border: 1px solid var(--surface-border);
      color: var(--text-secondary);
      border-radius: 20px;
      padding: 5px 12px;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
    }

    .preset-chip:hover {
      border-color: #06B6D4;
      color: #fff;
      background: #111D35;
    }

    .preset-chip.active {
      background: rgba(6, 182, 212, 0.16);
      border-color: #06B6D4;
      color: #38BDF8;
      font-weight: 700;
    }

    /* Route Timeline Stepper */
    .corridor-timeline {
      position: relative;
      padding-left: 26px;
      margin: 16px 0;
    }

    .corridor-timeline::before {
      content: '';
      position: absolute;
      left: 9px;
      top: 10px;
      bottom: 10px;
      width: 2px;
      background: #334155;
    }

    .timeline-node {
      position: relative;
      margin-bottom: 16px;
    }

    .timeline-node:last-child {
      margin-bottom: 0;
    }

    .timeline-dot {
      position: absolute;
      left: -26px;
      top: 3px;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 2px solid #334155;
      background: #090D16;
      box-shadow: 0 0 6px rgba(0,0,0,0.5);
    }

    .timeline-dot.dot-clear {
      border-color: #10B981;
      background: #10B981;
    }

    .timeline-dot.dot-warning {
      border-color: #F59E0B;
      background: #F59E0B;
    }

    .timeline-dot.dot-danger {
      border-color: #EF4444;
      background: #EF4444;
      animation: pulseAlert 1.5s infinite;
    }

    .timeline-dot.dot-festive {
      border-color: #B45309;
      background: #F59E0B;
    }

    @keyframes pulseAlert {
      0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
      70% { box-shadow: 0 0 0 8px rgba(239, 68, 68, 0); }
      100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }

    /* ---- MULTI-HORIZON INTERACTIVE FORECAST SUITE ---- */
    .horizon-scrubber-bar {
      display: flex;
      align-items: center;
      gap: 5px;
      background: #080D1A;
      border: 1px solid var(--surface-border);
      border-radius: var(--r-full);
      padding: 3px;
      margin: 10px 0;
      overflow-x: auto;
    }

    .horizon-btn {
      flex: 1;
      min-width: 60px;
      background: transparent;
      border: none;
      color: var(--text-secondary);
      font-size: 11px;
      font-weight: 600;
      padding: 6px 10px;
      border-radius: var(--r-full);
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .horizon-btn:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.05);
    }

    .horizon-btn.active {
      background: linear-gradient(135deg, #0284C7, #06B6D4);
      color: #fff;
      box-shadow: 0 0 12px rgba(6, 182, 212, 0.4);
      font-weight: 700;
    }

    .policy-toggle-box {
      display: flex;
      background: #060A14;
      border: 1px solid var(--surface-border);
      border-radius: 8px;
      padding: 3px;
      gap: 4px;
    }

    .policy-btn {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-secondary);
      font-size: 10px;
      font-weight: 600;
      padding: 6px 8px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }

    .policy-btn.active-gating {
      background: rgba(16, 185, 129, 0.18);
      border: 1px solid #10B981;
      color: #34D399;
      font-weight: 700;
    }

    .policy-btn.active-uncontrolled {
      background: rgba(239, 68, 68, 0.18);
      border: 1px solid #EF4444;
      color: #F87171;
      font-weight: 700;
    }

    .queue-depth-track {
      width: 100%;
      height: 7px;
      background: #1E293B;
      border-radius: 4px;
      overflow: hidden;
      margin: 6px 0;
      position: relative;
    }

    .queue-depth-fill {
      height: 100%;
      border-radius: 4px;
      transition: width 0.4s ease, background-color 0.4s ease;
    }

    .forecast-svg-wrap {
      width: 100%;
      height: 125px;
      margin: 10px 0;
      background: #070B16;
      border: 1px solid rgba(51, 65, 85, 0.5);
      border-radius: 8px;
      padding: 6px;
    }

    .table-filter-bar {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .table-filter-btn {
      background: #090E1D;
      border: 1px solid var(--surface-border);
      color: var(--text-secondary);
      font-size: 11px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: var(--r-full);
      cursor: pointer;
      transition: all 0.15s;
    }

    .table-filter-btn:hover {
      border-color: #06B6D4;
      color: #fff;
    }

    .table-filter-btn.active {
      background: rgba(6, 182, 212, 0.15);
      border-color: #06B6D4;
      color: #38BDF8;
      font-weight: 700;
    }

    /* ---- CHRONIC CONGESTION & REROUTE SIMULATION STYLES ---- */
    .chronic-metric-box {
      background: #060A14;
      border: 1px solid var(--surface-border);
      border-radius: 8px;
      padding: 10px 14px;
    }

    .solution-card {
      background: #090E1D;
      border: 1px solid var(--surface-border);
      border-radius: 8px;
      padding: 14px;
      transition: all 0.2s;
    }

    .solution-card:hover {
      border-color: rgba(52, 211, 153, 0.4);
    }

    .reroute-sim-wrap {
      background: #070B16;
      border: 1px solid var(--surface-border);
      border-radius: 10px;
      overflow: hidden;
      position: relative;
    }

    .neighbor-route-card:hover {
      border-color: rgba(56, 189, 248, 0.4);
      transform: translateY(-1px);
    }

    .neighbor-route-card.critical {
      border-left: 4px solid #EF4444;
      background: linear-gradient(135deg, rgba(239, 68, 68, 0.05), #090E1D 70%);
    }

    .neighbor-route-card.severe {
      border-left: 4px solid #F59E0B;
      background: linear-gradient(135deg, rgba(245, 158, 11, 0.05), #090E1D 70%);
    }

    .neighbor-route-card.moderate {
      border-left: 4px solid #38BDF8;
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.05), #090E1D 70%);
    }

    .neighbor-route-card.controlled {
      border-left: 4px solid #10B981;
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.05), #090E1D 70%);
    }

    .spillback-pipeline-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #060A14;
      border: 1px solid var(--surface-border);
      border-radius: 8px;
      padding: 10px 14px;
      overflow-x: auto;
      margin: 12px 0 16px;
    }

    .spillback-node {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #0D1527;
      border: 1px solid var(--surface-border);
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 11px;
      white-space: nowrap;
    }

    .spillback-arrow {
      color: #EF4444;
      font-size: 14px;
      font-weight: 700;
      animation: pulseArrow 1.5s infinite;
    }

    @keyframes pulseArrow {
      0%, 100% { opacity: 0.4; transform: translateX(0); }
      50% { opacity: 1; transform: translateX(3px); }
    }

    /* ---- BUTTONS ---- */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      border-radius: var(--r-full);
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      border: 1px solid transparent;
      text-decoration: none;
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn-brand {
      background: linear-gradient(135deg, #0284C7, #06B6D4);
      color: #fff;
      box-shadow: 0 2px 12px var(--brand-glow);
    }

    .btn-brand:hover {
      box-shadow: 0 4px 18px rgba(6, 182, 212, 0.45);
      filter: brightness(1.1);
    }

    .btn-festive {
      background: linear-gradient(135deg, #B45309, #F59E0B);
      color: #fff;
      box-shadow: 0 2px 12px var(--festive-glow);
    }

    .btn-outline {
      background: transparent;
      border-color: var(--surface-border);
      color: var(--text-main);
    }

    .btn-outline:hover {
      background: var(--surface-subtle);
      border-color: var(--brand-primary);
    }

    .btn-danger {
      background: rgba(239, 68, 68, 0.18);
      border-color: rgba(239, 68, 68, 0.4);
      color: #F87171;
    }

    .btn-danger:hover {
      background: #EF4444;
      color: #fff;
    }

    .btn-sm {
      padding: 5px 12px;
      font-size: 11px;
    }

    /* ---- CARDS & LAYOUT ---- */
    .main-container {
      max-width: 1280px;
      margin: 0 auto;
      padding: 24px 20px 60px;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--surface-border);
      border-radius: var(--r-md);
      padding: 20px;
      box-shadow: var(--shadow-card);
      transition: border-color 0.2s;
    }

    .card:hover {
      border-color: var(--border-bright);
    }

    .card-festive {
      border-color: var(--festive-border);
      background: linear-gradient(145deg, #1C1306 0%, var(--bg-card) 100%);
    }

    .grid-2 {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }

    .grid-4 {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
    }

    /* Metric Cards */
    .stat-box {
      background: #090E1D;
      border: 1px solid var(--surface-border);
      border-radius: var(--r-sm);
      padding: 14px;
    }

    .stat-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 4px;
    }

    .stat-value {
      font-family: var(--font-display);
      font-size: 24px;
      font-weight: 700;
      color: #fff;
    }

    .stat-sub {
      font-size: 11px;
      color: var(--text-secondary);
      margin-top: 2px;
    }

    /* Realistic Cartographic GIS Canvas */
    .corridor-canvas {
      width: 100%;
      height: 460px;
      background: #080D1A;
      border: 1px solid var(--surface-border);
      border-radius: var(--r-md);
      position: relative;
      overflow: hidden;
      box-shadow: inset 0 0 35px rgba(0, 0, 0, 0.7);
    }

    #hyderabadMapCanvas {
      width: 100%;
      height: 100%;
      display: block;
      cursor: crosshair;
    }

    .map-hud-tooltip {
      position: absolute;
      background: rgba(15, 23, 42, 0.95);
      border: 1.5px solid #06B6D4;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.7), 0 0 16px rgba(6, 182, 212, 0.35);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 11.5px;
      color: #fff;
      pointer-events: none;
      z-index: 50;
      display: none;
      transform: translate(-50%, -125%);
      white-space: nowrap;
      backdrop-filter: blur(10px);
    }

      top: 12px;
      right: 12px;
      background: rgba(15, 23, 42, 0.9);

      border-radius: 8px;
      padding: 6px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      z-index: 30;
    }

      background: var(--surface-subtle);
      border: 1px solid var(--surface-border);
      color: var(--text-main);
      width: 32px;
      height: 32px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.15s;
    }

      background: #0284C7;
      color: #fff;
      border-color: #38BDF8;
    }

    .map-legend-bar {
      position: absolute;
      bottom: 12px;
      left: 12px;
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(8px);
      border: 1px solid var(--surface-border);
      border-radius: 8px;
      padding: 7px 12px;
      font-size: 10.5px;
      display: flex;
      align-items: center;
      gap: 12px;
      z-index: 30;
      flex-wrap: wrap;
    }

    .map-compass-box {
      position: absolute;
      bottom: 12px;
      right: 12px;
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(8px);
      border: 1px solid var(--surface-border);
      border-radius: 8px;
      padding: 5px 10px;
      font-size: 10px;
      color: var(--text-muted);
      z-index: 30;
      text-align: right;
    }

      width: 100%;
      max-width: 380px;
      min-height: 640px;
      background: #030712;
      border-radius: 36px;
      border: 7px solid #1E293B;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), 0 0 25px rgba(6, 182, 212, 0.15);
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    .phone-notch {
      width: 120px;
      height: 20px;
      background: #1E293B;
      border-bottom-left-radius: 14px;
      border-bottom-right-radius: 14px;
      margin: 0 auto;
      z-index: 30;
    }

    .phone-body {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      color: #fff;
    }

    /* Tables */
    .table-container {
      overflow-x: auto;
      width: 100%;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12.5px;
      text-align: left;
    }

    th {
      background: #0B1120;
      padding: 10px 14px;
      color: var(--text-muted);
      font-weight: 600;
      text-transform: uppercase;
      font-size: 10.5px;
      letter-spacing: 0.05em;
      border-bottom: 1px solid var(--surface-border);
    }

    td {
      padding: 12px 14px;
      border-bottom: 1px solid rgba(51, 65, 85, 0.5);
    }

    tr:hover td {
      background: rgba(255, 255, 255, 0.02);
    }

    /* Modals */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(3, 7, 18, 0.75);
      backdrop-filter: blur(8px);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-content {
      background: var(--bg-card);
      border: 1px solid var(--surface-border);
      border-radius: var(--r-md);
      max-width: 600px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      padding: 24px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
    }

    .modal-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .close-btn {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: var(--surface-subtle);
      border: 1px solid var(--surface-border);
      color: var(--text-secondary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .close-btn:hover {
      color: #fff;
      background: var(--surface-border);
    }

    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #0E7490;
      color: #fff;
      padding: 12px 20px;
      border-radius: var(--r-md);
      border: 1px solid #06B6D4;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      font-size: 13px;
      font-weight: 600;
      z-index: 200;
      display: flex;
      align-items: center;
      gap: 10px;
      animation: slideUp 0.3s ease;
    }

    @keyframes slideUp {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }

      gap: 3px;

      border: 1px solid rgba(56, 189, 248, 0.4);
    }
    .badge-derived {

      color: #34D399;
      border: 1px solid rgba(52, 211, 153, 0.4);

    .badge-model {

      color: #C084FC;
      border: 1px solid rgba(192, 132, 252, 0.4);

      border: 1px solid rgba(251, 146, 60, 0.4);
    }
    .badge-unavailable {
      background: rgba(148, 163, 184, 0.12);
      color: #94A3B8;
      border: 1px solid rgba(148, 163, 184, 0.3);
    }

    .backend-status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #080D1A;
      border: 1px solid var(--surface-border);
      border-radius: var(--r-full);
      padding: 3px 9px;
      font-size: 10.5px;
      font-weight: 600;
      color: var(--text-secondary);
      font-family: var(--font-mono);
      transition: all 0.25s ease;
      white-space: nowrap;

    .backend-status-pill.online {
      border-color: rgba(52, 211, 153, 0.45);
      color: #34D399;
      background: rgba(6, 78, 59, 0.25);
    }
    .backend-status-pill.offline {
      border-color: rgba(239, 68, 68, 0.45);
      color: #EF4444;
      background: rgba(127, 29, 29, 0.25);
    }
    .status-dot {
      width: 6.5px;
      height: 6.5px;
      border-radius: 50%;
      background: #94A3B8;
      display: inline-block;
    }
    .backend-status-pill.online .status-dot {
      background: #10B981;
      box-shadow: 0 0 8px #10B981;
      animation: pulse 2s infinite;

    .backend-status-pill.offline .status-dot {
      background: #EF4444;
    }

    @media (max-width: 1100px) {

    }

      }

      }
      .header-nav-row {
        justify-content: flex-start;
        overflow-x: auto;
        padding-bottom: 2px;
        scrollbar-width: none;
      }
      .header-nav-row::-webkit-scrollbar {
        display: none;
      }
    }

    @media (max-width: 680px) {
      .header-top-row {
        flex-wrap: wrap;
        gap: 8px;
      }
      .header-actions {
        width: 100%;
        justify-content: space-between;

        flex: 1;
        justify-content: space-between;
      }
      .role-pill {
        padding: 4px 6px;
        font-size: 10px;
      }
      .logo-title {
        font-size: 16px;
      }
      .logo-badge {
        width: 32px;
        height: 32px;
        font-size: 16px;
      }

    const API_BASE = "http://127.0.0.1:8000/api";

    function renderProvenanceBadge(type, tooltip) {
      const classes = {
        'DATA': 'badge-data',
        'DERIVED': 'badge-derived',
        'MODEL': 'badge-model',
        'SIMULATION': 'badge-simulation',
        'UNAVAILABLE': 'badge-unavailable'
      };
      const icons = {
        'DATA': '📦',
        'DERIVED': '📐',
        'MODEL': '🧠',
        'SIMULATION': '🧪',
        'UNAVAILABLE': '⚠️'
      };
      const cls = classes[type] || 'badge-data';
      const icn = icons[type] || '';
      return `<span class="badge-provenance ${cls}" title="${tooltip || ''}">${icn} [${type}]</span>`;
    }

    async function apiFetch(endpoint, options = {}) {
      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 6000);
        const res = await fetch(`${API_BASE}${endpoint}`, {
          ...options,
          signal: controller.signal
        });
        clearTimeout(timeoutId);
        if (!res.ok) return null;
        return await res.json();
      } catch (err) {
        console.warn(`[GatiMarg API] Error fetching ${endpoint}:`, err.message);
        return null;
      }
    }

    async function initBackendData() {
      const indicator = document.getElementById("backendIndicator");
      const statusText = document.getElementById("backendStatusText");

      try {
        const health = await apiFetch("/health");
        if (health && health.status === "ONLINE") {
          isBackendOnline = true;
          if (indicator) {
            indicator.classList.remove("offline");
            indicator.classList.add("online");
          }
          if (statusText) {
            statusText.textContent = "● LIVE NEURAX BACKEND (436 Links / 120 Nodes)";
          }
          console.log("⚡ [GatiMarg] Connected to Live NeuraX Backend API on port 8000.");

          // 1. Fetch Network Summary
          const summary = await apiFetch("/network/summary");
          if (summary) {
            STATE.network.totalSegments = summary.total_segments || 436;
            STATE.network.totalNodes = summary.total_nodes || 120;
            STATE.network.totalRecords = (summary.traffic_records_train || 0) + (summary.traffic_records_val || 0);
            if (summary.hygiene_metrics) {
              STATE.network.stuckSensorsRepaired = summary.hygiene_metrics.stuck_sensors_repaired || 84;
              STATE.network.negativeSpeedsClamped = summary.hygiene_metrics.negative_speeds_clamped || 112;
              STATE.network.spikesSmoothed = summary.hygiene_metrics.outlier_spikes_smoothed || 67;
            }
          }

          // 2. Fetch Congestion Ranking & Telemetry
          const ranking = await apiFetch("/congestion/ranking?limit=50");
          if (ranking && ranking.ranking) {
            STATE.congestionRanking = ranking.ranking;
          }

          // 3. Fetch Real Incidents from Dataset
          const incData = await apiFetch("/incidents");
          if (incData && incData.incidents && incData.incidents.length > 0) {
            STATE.realIncidents = incData.incidents;
          }

          // 4. Fetch Chronic Hotspots & Planning Candidates
          const chronicData = await apiFetch("/chronic/hotspots");
          if (chronicData && chronicData.hotspots) {
            STATE.chronicHotspotsList = chronicData.hotspots;
          }

          // 5. Fetch Initial Forecast for Default Corridor
          await fetchLiveForecast(STATE.selectedForecastSegmentId, STATE.interventionMode);

          render();
        } else {
          setOfflineBackendState();
        }
      } catch (e) {
        setOfflineBackendState();
      }
    }

    function setOfflineBackendState() {
      isBackendOnline = false;

    const PRESET_NODES = {
      'mehdipatnam_hitec': { origin: 'N032', destination: 'N044' },
      'secunderabad_tankbund': { origin: 'N012', destination: 'N065' },
      'gachibowli_cyber': { origin: 'N030', destination: 'N089' },
      'charminar_panjagutta': { origin: 'N005', destination: 'N075' }
    };

    async function selectRoutePreset(presetKey) {
      const r = HYDERABAD_ROUTES_DB[presetKey];
      if (!r) return;
      STATE.citizenRoute.origin = r.origin;
      STATE.citizenRoute.destination = r.destination;
      STATE.citizenRoute.activePreset = presetKey;
      if (isBackendOnline) {
        const pair = PRESET_NODES[presetKey] || { origin: 'N001', destination: 'N050' };
        const routeData = await apiFetch("/routes/plan", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ origin_node: pair.origin, destination_node: pair.destination })
        });
        if (routeData && routeData.primary_route) {
          STATE.liveCitizenRoute = routeData;
        }
      }
      render();
      showToast(`Scanned corridor: ${r.title}`);
    }

    async function scanCitizenRoute() {
      const origInput = document.getElementById('routeOriginInput');
      const destInput = document.getElementById('routeDestInput');
      const orig = origInput ? origInput.value.trim() : STATE.citizenRoute.origin;
      const dest = destInput ? destInput.value.trim() : STATE.citizenRoute.destination;

      STATE.citizenRoute.origin = orig || 'Mehdipatnam';
      STATE.citizenRoute.destination = dest || 'HITEC City';

      const text = (orig + ' ' + dest).toLowerCase();
      let preset = 'mehdipatnam_hitec';
      if (text.includes('mehdipatnam') || text.includes('pvnr') || text.includes('airport')) {
        preset = 'mehdipatnam_hitec';
      } else if (text.includes('tank bund') || text.includes('secunderabad') || text.includes('hussain') || text.includes('secretariat') || text.includes('bonalu') || text.includes('ganesh')) {
        preset = 'secunderabad_tankbund';
      } else if (text.includes('charminar') || text.includes('old city') || text.includes('panjagutta') || text.includes('nayapul')) {

    // ──── 7. MULTI-HORIZON INTERACTIVE FORECAST ENGINE ────
    function renderForecastSvgChart(corridorData, activeIdx, mode) {
      const activePoints = corridorData.active;
      const nonePoints = corridorData.none;
      const W = 330;
      const H = 105;
      const padL = 26;
      const padR = 20;
      const padT = 14;
      const padB = 22;
      const graphW = W - padL - padR;
      const graphH = H - padT - padB;
      const maxSpeed = 80;

      function getX(i) { return padL + (i / 4) * graphW; }
      function getY(spd) { return padT + graphH - (Math.min(spd, maxSpeed) / maxSpeed) * graphH; }

      const activePath = activePoints.map((p, i) => `${i === 0 ? 'M' : 'L'} ${getX(i).toFixed(1)} ${getY(p.speed).toFixed(1)}`).join(' ');
      const nonePath = nonePoints.map((p, i) => `${i === 0 ? 'M' : 'L'} ${getX(i).toFixed(1)} ${getY(p.speed).toFixed(1)}`).join(' ');

      return `
        <svg viewBox="0 0 ${W} ${H}" style="width: 100%; height: 100%; overflow: visible;">
          <!-- Speed Benchmark Grid Lines -->
          <line x1="${padL}" y1="${getY(60)}" x2="${W - padR}" y2="${getY(60)}" stroke="#334155" stroke-dasharray="3,3" stroke-width="0.8" />
          <text x="${padL - 4}" y="${getY(60) + 3}" fill="#64748B" font-size="8" text-anchor="end" font-family="var(--font-mono)">60k</text>

          <line x1="${padL}" y1="${getY(25)}" x2="${W - padR}" y2="${getY(25)}" stroke="rgba(245, 158, 11, 0.4)" stroke-dasharray="2,2" stroke-width="0.8" />
          <text x="${padL - 4}" y="${getY(25) + 3}" fill="#F59E0B" font-size="8" text-anchor="end" font-family="var(--font-mono)">25k</text>

          <line x1="${padL}" y1="${getY(15)}" x2="${W - padR}" y2="${getY(15)}" stroke="rgba(239, 68, 68, 0.5)" stroke-dasharray="2,2" stroke-width="0.8" />
          <text x="${padL - 4}" y="${getY(15) + 3}" fill="#EF4444" font-size="8" text-anchor="end" font-family="var(--font-mono)">15k</text>

          <!-- Status Quo Uncontrolled Curve -->
          <path d="${nonePath}" fill="none" stroke="${mode === 'none' ? '#EF4444' : '#64748B'}" stroke-width="${mode === 'none' ? 2.5 : 1.2}" stroke-dasharray="${mode === 'none' ? 'none' : '4,3'}" opacity="${mode === 'none' ? 1 : 0.45}" />

          <!-- GatiMarg Active Intervention Curve -->
          <path d="${activePath}" fill="none" stroke="${mode === 'active' ? '#06B6D4' : '#64748B'}" stroke-width="${mode === 'active' ? 2.8 : 1.2}" opacity="${mode === 'active' ? 1 : 0.45}" />

          <!-- Interactive Horizon Points -->
          ${activePoints.map((p, i) => {
            const px = getX(i);
            const curSpd = (mode === 'active' ? p.speed : nonePoints[i].speed);
            const py = getY(curSpd);
            const isCur = i === activeIdx;
            return `
              <circle cx="${px}" cy="${py}" r="${isCur ? 6 : 3.5}" fill="${isCur ? '#fff' : (mode === 'active' ? '#06B6D4' : '#EF4444')}" stroke="${mode === 'active' ? '#06B6D4' : '#EF4444'}" stroke-width="2" style="cursor: pointer;" onclick="setForecastHorizon(${i})">
                <title>T+${i * 15}m: ${curSpd.toFixed(1)} km/h</title>
              </circle>
              ${isCur ? `<circle cx="${px}" cy="${py}" r="11" fill="none" stroke="${mode === 'active' ? '#06B6D4' : '#EF4444'}" stroke-width="1.5" opacity="0.6"><animate attributeName="r" values="6;13;6" dur="1.8s" repeatCount="indefinite"/></circle>` : ''}
              <text x="${px}" y="${H - 5}" fill="${isCur ? '#38BDF8' : '#64748B'}" font-size="8.5" font-weight="${isCur ? 'bold' : 'normal'}" text-anchor="middle" font-family="var(--font-mono)" style="cursor: pointer;" onclick="setForecastHorizon(${i})">
                ${i === 0 ? 'Now' : `+${i * 15}m`}
              </text>
            `;
          }).join('')}
        </svg>
      `;
    }

    function initRealisticHyderabadMap() {
      const canvas = document.getElementById('hyderabadMapCanvas');
      if (!canvas) return;

      const ctx = canvas.getContext('2d');
      const container = document.getElementById('corridorMapContainer');
      const tooltip = document.getElementById('mapTooltip');

      // Adjust canvas resolution
      const rect = container.getBoundingClientRect();
      canvas.width = rect.width || 760;
      canvas.height = rect.height || 460;

      // Spawn initial vehicle particles
      mapParticles = [];
      for (let i = 0; i < 90; i++) {
        const cIdx = Math.floor(Math.random() * MAP_CORRIDORS.length);
        mapParticles.push({
          corridorIndex: cIdx,
          progress: Math.random(),
          speedMultiplier: 0.8 + Math.random() * 0.4
        });
      }

      // Spawn rain drops
      mapRainDrops = [];
      for (let i = 0; i < 120; i++) {
        mapRainDrops.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          len: 10 + Math.random() * 12,
          speed: 8 + Math.random() * 6
        });
      }

      // Mouse interactivity for hover HUD
      canvas.onmousemove = function(e) {
        const cRect = canvas.getBoundingClientRect();
        const mx = (e.clientX - cRect.left - mapPanX) / mapZoomScale;
        const my = (e.clientY - cRect.top - mapPanY) / mapZoomScale;

        let closestSeg = null;
        let minDist = 20; // 20px detection threshold

        MAP_CORRIDORS.forEach(c => {
          for (let i = 0; i < c.points.length - 1; i++) {
            const p1 = c.points[i];
            const p2 = c.points[i + 1];
            const d = distToSegment({x: mx, y: my}, p1, p2);
            if (d < minDist) {
              minDist = d;
              closestSeg = c;
            }
          }
        });

        hoveredSegment = closestSeg;

        if (closestSeg && tooltip) {
          tooltip.style.display = 'block';
          tooltip.style.left = (e.clientX - cRect.left) + 'px';
          tooltip.style.top = (e.clientY - cRect.top) + 'px';

          document.getElementById('ttTitle').textContent = closestSeg.name;
          document.getElementById('ttSub').textContent = `Segment ID: ${closestSeg.id} · Priority Link`;
          
          let statBadge = '';
          if (closestSeg.status === 'congested') statBadge = '<span style="color: #F87171;">⚠️ Gridlocked: Stalled Transit Bus</span>';
          else if (closestSeg.status === 'shockwave') statBadge = '<span style="color: #F59E0B;">⚡ Upstream Spillback Shockwave (-14.2 km/h)</span>';
          else if (closestSeg.status === 'festive-blocked') statBadge = '<span style="color: #EF4444;">🪔 Festive Cordon (Procession Barricade)</span>';
          else if (closestSeg.status === 'diversion') statBadge = '<span style="color: #34D399;">✓ Active Legal Bypass (Recommended)</span>';
          else statBadge = '<span style="color: #34D399;">✓ Fluid Traffic Flow</span>';

          document.getElementById('ttMetrics').innerHTML = `
            Live Speed: <strong>${closestSeg.speed} km/h</strong> (Free: ${closestSeg.freeSpeed} km/h)<br>
            Discharge Flow: <strong>${closestSeg.flow.toLocaleString()} vph</strong> (Cap: ${closestSeg.cap.toLocaleString()} vph)<br>
            ${statBadge}<br>
            <span style="color: #38BDF8; font-size: 10px; font-weight: 600;">[Click road to inspect segment telemetry]</span>
          `;
        } else if (tooltip) {
          tooltip.style.display = 'none';
        }
      };

      canvas.onmouseleave = function() {
        hoveredSegment = null;
        if (tooltip) tooltip.style.display = 'none';
      };

      canvas.onclick = function() {
        if (hoveredSegment) {
          viewSegmentDetails(hoveredSegment.id);
        }
      };

      // Start 60fps render loop
      if (mapAnimId) cancelAnimationFrame(mapAnimId);

      function loop() {
        if (STATE.currentView !== 'dashboard') return;
        drawRealisticMap(canvas, ctx);
        mapAnimId = requestAnimationFrame(loop);
      }
      loop();
    }

    function drawRealisticMap(canvas, ctx) {
      const W = canvas.width;
      const H = canvas.height;

      ctx.clearRect(0, 0, W, H);
      ctx.save();
      ctx.translate(mapPanX, mapPanY);
      ctx.scale(mapZoomScale, mapZoomScale);

      // 1. Background Cartographic Grid
      ctx.strokeStyle = "rgba(30, 41, 59, 0.45)";
      ctx.lineWidth = 0.6;
      for (let x = 0; x < W + 200; x += 45) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, H + 200);
        ctx.stroke();
      }
      for (let y = 0; y < H + 200; y += 45) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(W + 200, y);
        ctx.stroke();
      }

      // 2. Water Bodies (Hussain Sagar, Durgam Cheruvu, Musi River)
      // Musi River (meandering across south)
      ctx.beginPath();
      ctx.moveTo(20, 395);
      ctx.bezierCurveTo(160, 420, 300, 385, 430, 410);
      ctx.bezierCurveTo(570, 435, 680, 400, 760, 410);
      ctx.strokeStyle = "#0B2844";
      ctx.lineWidth = 14;
      ctx.lineCap = "round";
      ctx.stroke();

      ctx.font = "italic 9px var(--font-sans)";
      ctx.fillStyle = "rgba(56, 189, 248, 0.35)";
      ctx.fillText("Musi River Corridor", 230, 403);

      // Durgam Cheruvu Lake (west)
      ctx.beginPath();
      ctx.ellipse(145, 205, 38, 18, -0.25, 0, Math.PI * 2);
      ctx.fillStyle = "#0C2339";
      ctx.fill();
      ctx.strokeStyle = "#0284C7";
      ctx.lineWidth = 1.2;
      ctx.stroke();
      ctx.fillText("Durgam Cheruvu", 115, 208);

      // Hussain Sagar Lake (organic heart polygon with glowing shoreline)
      ctx.beginPath();
      ctx.moveTo(415, 175);
      ctx.bezierCurveTo(445, 135, 505, 145, 525, 185);
      ctx.bezierCurveTo(540, 225, 515, 270, 470, 275);
      ctx.bezierCurveTo(430, 280, 400, 240, 415, 175);
      ctx.closePath();
      ctx.fillStyle = "#0D2B48";
      ctx.fill();
      ctx.strokeStyle = "rgba(6, 182, 212, 0.5)";
      ctx.lineWidth = 2;
      ctx.stroke();

      // Buddha Statue Marker in center of Hussain Sagar
      ctx.beginPath();
      ctx.arc(468, 208, 4, 0, Math.PI * 2);
      ctx.fillStyle = "#FDE047";
      ctx.fill();
      ctx.font = "bold 9.5px var(--font-sans)";
      ctx.fillStyle = "#E0F2FE";
      ctx.fillText("Hussain Sagar Lake", 432, 224);
      ctx.font = "8px var(--font-sans)";
      ctx.fillStyle = "#FDE047";
      ctx.fillText("● Buddha Statue", 438, 235);

      // 3. Green Open Spaces (KBR Park, Lumbini Park)
      ctx.beginPath();
      ctx.ellipse(195, 245, 24, 16, 0.2, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(5, 150, 105, 0.15)";
      ctx.fill();
      ctx.strokeStyle = "rgba(5, 150, 105, 0.35)";
      ctx.stroke();
      ctx.fillStyle = "rgba(52, 211, 153, 0.4)";
      ctx.fillText("KBR Park", 175, 248);

      // 4. Render All Road Corridors
      MAP_CORRIDORS.forEach(c => {
        const isHov = hoveredSegment && hoveredSegment.id === c.id;

        // Hover halo
        if (isHov) {
          ctx.beginPath();
          ctx.moveTo(c.points[0].x, c.points[0].y);
          for (let i = 1; i < c.points.length; i++) ctx.lineTo(c.points[i].x, c.points[i].y);
          ctx.strokeStyle = "rgba(6, 182, 212, 0.5)";
          ctx.lineWidth = c.width + 8;
          ctx.lineCap = "round";
          ctx.lineJoin = "round";
          ctx.stroke();
        }

        // Road base / casing
        ctx.beginPath();
        ctx.moveTo(c.points[0].x, c.points[0].y);
        for (let i = 1; i < c.points.length; i++) ctx.lineTo(c.points[i].x, c.points[i].y);
        ctx.strokeStyle = isHov ? "#fff" : c.color;
        ctx.lineWidth = isHov ? c.width + 1.5 : c.width;
        ctx.lineCap = "round";
        ctx.lineJoin = "round";

        // Striped hazard line for festive cordons
        if (c.isStriped) {
          ctx.setLineDash([8, 6]);
        } else {
          ctx.setLineDash([]);
        }
        ctx.stroke();
        ctx.setLineDash([]); // Reset dash

        // Draw Incident Marker on PVNR
        if (c.hasIncident && c.incidentPoint) {
          const now = Date.now() / 300;
          const pulseR = 7 + Math.sin(now) * 3;
          ctx.beginPath();
          ctx.arc(c.incidentPoint.x, c.incidentPoint.y, pulseR, 0, Math.PI * 2);
          ctx.fillStyle = "rgba(239, 68, 68, 0.35)";
          ctx.fill();

          ctx.beginPath();
          ctx.arc(c.incidentPoint.x, c.incidentPoint.y, 4, 0, Math.PI * 2);
          ctx.fillStyle = "#EF4444";
          ctx.fill();
          ctx.strokeStyle = "#fff";
          ctx.lineWidth = 1;
          ctx.stroke();

          ctx.font = "bold 9px var(--font-sans)";
          ctx.fillStyle = "#F87171";
          ctx.fillText("🚨 STALL (PVNR Ramp)", c.incidentPoint.x + 8, c.incidentPoint.y - 4);
        }

        // Draw Shockwave Propagation Wave
        if (c.hasShockwave) {
          const wavePhase = (Date.now() / 400) % 1;
          const waveP = getPointAlongPath(c.points, wavePhase);
          ctx.beginPath();
          ctx.arc(waveP.x, waveP.y, 5, 0, Math.PI * 2);
          ctx.fillStyle = "rgba(245, 158, 11, 0.8)";
          ctx.fill();
        }

        // Draw Directional Chevrons on Recommended Bypass
        if (c.isDiversion) {
          const divP = getPointAlongPath(c.points, (Date.now() / 800) % 1);
          ctx.beginPath();
          ctx.arc(divP.x, divP.y, 4, 0, Math.PI * 2);
          ctx.fillStyle = "#34D399";
          ctx.fill();
        }
      });

      // 5. Update & Render Moving Vehicle Particles
      mapParticles.forEach(p => {
        const corridor = MAP_CORRIDORS[p.corridorIndex];
        if (!corridor) return;

        // Effective speed along path
        let baseStep = 0.003 * p.speedMultiplier;
        if (corridor.status === 'congested') baseStep = 0.0008;
        if (corridor.status === 'festive-blocked') baseStep = 0.0003;
        if (STATE.simulatedWeather === 'monsoon_rain') baseStep *= 0.75;

        p.progress += baseStep;
        if (p.progress >= 1) p.progress = 0;

        const pt = getPointAlongPath(corridor.points, p.progress);

        ctx.beginPath();
        ctx.arc(pt.x, pt.y, 2.2, 0, Math.PI * 2);

        // Particle color
        if (corridor.status === 'congested') ctx.fillStyle = "#FCA5A5";
        else if (corridor.status === 'festive-blocked') ctx.fillStyle = "#F87171";
        else if (corridor.status === 'shockwave') ctx.fillStyle = "#FDE68A";
        else if (corridor.status === 'diversion') ctx.fillStyle = "#6EE7B7";
        else ctx.fillStyle = "#E0F2FE";

        ctx.fill();
      });

      // 6. Draw Key Junction Nodes
      const JUNC_NODES = [
        { name: "N44", x: 280, y: 300 },
        { name: "N12", x: 45, y: 140 },
        { name: "N89", x: 460, y: 275 },
        { name: "N90", x: 500, y: 155 },
        { name: "N102", x: 380, y: 270 },
        { name: "N77", x: 545, y: 105 }
      ];
      JUNC_NODES.forEach(jn => {
        ctx.beginPath();
        ctx.arc(jn.x, jn.y, 3.5, 0, Math.PI * 2);
        ctx.fillStyle = "#0F172A";
        ctx.fill();
        ctx.strokeStyle = "#38BDF8";
        ctx.lineWidth = 1.5;
        ctx.stroke();

        ctx.font = "600 8px var(--font-mono)";
        ctx.fillStyle = "rgba(148, 163, 184, 0.75)";
        ctx.fillText(jn.name, jn.x - 7, jn.y - 6);
      });

      // 7. Geographic Landmarks Text
      ctx.font = "bold 9px var(--font-sans)";
      ctx.fillStyle = "rgba(226, 232, 240, 0.65)";
      MAP_LANDMARKS.forEach(lm => {
        ctx.fillText(lm.name, lm.x, lm.y);
      });

      // 8. Monsoon Rain Overlay Animation (if toggled)
      if (STATE.simulatedWeather === 'monsoon_rain') {
        ctx.strokeStyle = "rgba(186, 230, 253, 0.35)";
        ctx.lineWidth = 1;
        mapRainDrops.forEach(r => {
          ctx.beginPath();
          ctx.moveTo(r.x, r.y);
          ctx.lineTo(r.x - 3, r.y + r.len);
          ctx.stroke();
          r.y += r.speed;
          r.x -= 1.5;
          if (r.y > H) {
            r.y = -10;
            r.x = Math.random() * W;
          }
        });
      }

      ctx.restore();
    }

    // ──── DEDICATED IN-TRIP VEHICLE REROUTING SIMULATION ENGINE (FEATURE 2) ────
    let rerouteAnimId = null;
    let rerouteFlowParticles = [];

    function initRerouteMapSimulation() {
      const canvas = document.getElementById('rerouteCanvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      if (rerouteAnimId) cancelAnimationFrame(rerouteAnimId);

      // Handle retina / high-DPI scaling
      const rect = canvas.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      const W = rect.width || 800;
      const H = rect.height || 420;
      canvas.width = W * dpr;
      canvas.height = H * dpr;
      ctx.scale(dpr, dpr);

      // Seed ambient background vehicles
      if (rerouteFlowParticles.length === 0) {
        for (let i = 0; i < 24; i++) {
          rerouteFlowParticles.push({
            route: Math.random() > 0.4 ? 'straight' : 'bypass',
            progress: Math.random(),
            speed: 0.0012 + Math.random() * 0.0015,
            color: ['#38BDF8', '#818CF8', '#FDE047', '#E2E8F0'][Math.floor(Math.random() * 4)],
            size: 4 + Math.random() * 2
          });
        }
      }

      // Geometry Definition for Reroute Map
      const startPt = { x: 70, y: 150 };
      const decisionPt = { x: 300, y: 150 };
      const jamStartPt = { x: 440, y: 150 };
      const jamStallPt = { x: 570, y: 150 };
      const straightEndPt = { x: 760, y: 150 };

      // Bypass curve control points (loops around via Pillar 140 Service Road)
      const bypassPts = [
        decisionPt,
        { x: 370, y: 280 },
        { x: 520, y: 310 },
        { x: 670, y: 260 },
        straightEndPt
      ];

      function getBypassPoint(t) {
        // Multi-segment quadratic / linear interpolation
        return getPointAlongPath(bypassPts, t);
      }

      function getStraightPoint(t) {
        return {
          x: startPt.x + (straightEndPt.x - startPt.x) * t,
          y: startPt.y + (straightEndPt.y - startPt.y) * t
        };
      }

      let frameCounter = 0;

      function renderSimulationFrame() {
        if (STATE.currentView !== 'reroute') {
          if (rerouteAnimId) cancelAnimationFrame(rerouteAnimId);
          return;
        }

        frameCounter++;
        const s = STATE.rerouteSim;

        // 1. Vehicle Movement Logic
        if (s.running) {
          const isBypass = (s.rerouteDecision === 'auto_bypass');

          // Check if vehicle has reached decision junction (progress ~ 0.33)
          if (s.vehicleProgress < 0.33) {
            // Approaching junction
            s.currentSpeedKmh = 50;
            s.vehicleProgress += 0.0018;
            if (s.hasCongestionAhead) {
              s.statusText = isBypass ?
                "⚠️ Congestion Alert: PVNR Ramp blocked ahead. Automatic telemetry scheduled to divert car onto Pillar 140 Bypass at Node 44." :
                "⚠️ Congestion Alert: PVNR Ramp blocked ahead. Vehicle scheduled to hold course straight into queue.";
            } else {
              s.statusText = "🟢 Telemetry Normal: Highway clear. Approaching Node 44 junction.";
            }
          } else if (isBypass) {
            // Diverted onto legal bypass route
            s.currentSpeedKmh = 48 + Math.floor(Math.sin(frameCounter / 15) * 3);
            s.vehicleProgress += 0.0022;
            s.statusText = "🔀 ACTIVE BYPASS: Vehicle successfully diverted via Pillar 140 Service Arterial. Unobstructed free flow at 48 km/h. Saving 34 minutes!";
          } else {
            // Continued on straight highway
            if (s.hasCongestionAhead && s.vehicleProgress >= 0.52) {
              // Stuck in severe congestion!
              s.currentSpeedKmh = 4 + Math.floor(Math.sin(frameCounter / 20) * 2);
              s.vehicleProgress += 0.0003; // Agonizingly slow
              s.statusText = "🚨 TRAPPED IN GRIDLOCK: Behind stalled TSRTC bus on PVNR Ramp! Crawling at 4 km/h with 2.4 km spillback. Click 'Divert to Bypass' to redirect!";
            } else {
              s.currentSpeedKmh = 52;
              s.vehicleProgress += 0.002;
              s.statusText = s.hasCongestionAhead ?
                "⚠️ Warning: Stalled bus reported 600m ahead. Rapidly decelerating towards shockwave queue." :
                "🟢 PVNR Express corridor clear: cruising at 52 km/h.";
            }
          }

          // Journey Completion check
          if (s.vehicleProgress >= 1.0) {
            s.vehicleProgress = 1.0;
            s.running = false;
            s.statusText = isBypass ?
              "🏁 JOURNEY COMPLETE: Reached destination via Pillar 140 Bypass on time! Total delay avoided: 34 minutes." :
              "🏁 JOURNEY FINISHED: Arrived at destination with severe 45-minute spillback delay.";
          }

          // Update HUD without re-rendering entire page
          const speedEl = document.getElementById('rSimSpeed');
          const progEl = document.getElementById('rSimProgress');
          const statEl = document.getElementById('rSimStatus');
          if (speedEl) {
            speedEl.textContent = `${s.currentSpeedKmh} km/h`;
            speedEl.style.color = s.currentSpeedKmh < 20 ? '#EF4444' : '#34D399';
          }
          if (progEl) {
            progEl.textContent = `${Math.round(s.vehicleProgress * 100)}%`;
          }
          if (statEl) {
            statEl.textContent = s.statusText;
          }
        }

        // 2. Clear Screen
        ctx.fillStyle = "#070B16";
        ctx.fillRect(0, 0, W, H);

        // Cartographic grid lines
        ctx.strokeStyle = "rgba(30, 41, 59, 0.4)";
        ctx.lineWidth = 0.5;
        for (let x = 0; x < W; x += 40) {
          ctx.beginPath();
          ctx.moveTo(x, 0);
          ctx.lineTo(x, H);
          ctx.stroke();
        }
        for (let y = 0; y < H; y += 40) {
          ctx.beginPath();
          ctx.moveTo(0, y);
          ctx.lineTo(W, y);
          ctx.stroke();
        }

        // 3. Draw Road Corridors
        // ── Road A: Original Highway Straight
        ctx.beginPath();
        ctx.moveTo(startPt.x, startPt.y);
        ctx.lineTo(straightEndPt.x, straightEndPt.y);
        ctx.lineWidth = 26;
        ctx.strokeStyle = "#131C31";
        ctx.lineCap = "round";
        ctx.stroke();

        ctx.lineWidth = 20;
        ctx.strokeStyle = "#1E293B";
        ctx.stroke();

        // ── Road B: Low-Congestion Bypass Corridor (Curve)
        ctx.beginPath();
        ctx.moveTo(bypassPts[0].x, bypassPts[0].y);
        for (let i = 1; i < bypassPts.length; i++) {
          ctx.lineTo(bypassPts[i].x, bypassPts[i].y);
        }
        ctx.lineWidth = 24;
        ctx.strokeStyle = "rgba(6, 78, 59, 0.35)";
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.stroke();

        ctx.lineWidth = 18;
        ctx.strokeStyle = "#064E3B";
        ctx.stroke();

        // Highlighting active reroute bypass
        if (s.rerouteDecision === 'auto_bypass') {
          ctx.beginPath();
          ctx.moveTo(bypassPts[0].x, bypassPts[0].y);
          for (let i = 1; i < bypassPts.length; i++) {
            ctx.lineTo(bypassPts[i].x, bypassPts[i].y);
          }
          ctx.lineWidth = 4;
          ctx.strokeStyle = "rgba(52, 211, 153, 0.7)";
          ctx.setLineDash([8, 6]);
          ctx.lineDashOffset = -frameCounter * 1.5;
          ctx.stroke();
          ctx.setLineDash([]);
        }

        // Road centerline on straight road
        ctx.beginPath();
        ctx.moveTo(startPt.x, startPt.y);
        ctx.lineTo(straightEndPt.x, straightEndPt.y);
        ctx.lineWidth = 2;
        ctx.strokeStyle = "rgba(255, 255, 255, 0.25)";
        ctx.setLineDash([10, 10]);
        ctx.lineDashOffset = -frameCounter * 0.8;
        ctx.stroke();
        ctx.setLineDash([]);

        // 4. Ahead Congestion Zone Rendering (if active)
        if (s.hasCongestionAhead) {
          // Red warning glow zone
          const glowGrad = ctx.createLinearGradient(jamStartPt.x, 150, jamStallPt.x + 40, 150);
          glowGrad.addColorStop(0, "rgba(239, 68, 68, 0.1)");
          glowGrad.addColorStop(0.5, "rgba(239, 68, 68, 0.45)");
          glowGrad.addColorStop(1, "rgba(239, 68, 68, 0.8)");

          ctx.beginPath();
          ctx.moveTo(jamStartPt.x, 150);
          ctx.lineTo(jamStallPt.x + 30, 150);
          ctx.lineWidth = 20;
          ctx.strokeStyle = glowGrad;
          ctx.stroke();

          // Draw Stalled TSRTC Bus at jamStallPt
          ctx.save();
          ctx.translate(jamStallPt.x, jamStallPt.y);
          // Hazard Flashing
          const flash = Math.floor(frameCounter / 15) % 2 === 0;
          if (flash) {
            ctx.beginPath();
            ctx.arc(0, 0, 18, 0, Math.PI * 2);
            ctx.fillStyle = "rgba(239, 68, 68, 0.35)";
            ctx.fill();
          }
          // Bus Body
          ctx.fillStyle = "#B91C1C";
          ctx.fillRect(-14, -7, 28, 14);
          ctx.strokeStyle = "#FCA5A5";
          ctx.lineWidth = 1.5;
          ctx.strokeRect(-14, -7, 28, 14);
          // Hazard lights
          ctx.fillStyle = flash ? "#FDE047" : "#78350F";
          ctx.fillRect(-13, -7, 4, 3);
          ctx.fillRect(-13, 4, 4, 3);
          ctx.fillRect(9, -7, 4, 3);
          ctx.fillRect(9, 4, 4, 3);
          // Breakdown label
          ctx.font = "bold 9px var(--font-sans)";
          ctx.fillStyle = "#F87171";
          ctx.fillText("🚨 STALLED BUS (4 km/h)", -45, -16);
          ctx.restore();

          // Draw Queue of 4 Trapped Cars behind the bus
          for (let c = 1; c <= 4; c++) {
            const cx = jamStallPt.x - (c * 24);
            ctx.fillStyle = "#475569";
            ctx.fillRect(cx - 7, 145, 14, 10);
            // Red brake lights
            ctx.fillStyle = "#EF4444";
            ctx.fillRect(cx - 7, 146, 2, 8);
          }

          // Warning cones around breakdown
          ctx.fillStyle = "#F97316";
          [-22, 0, 22].forEach(ox => {
            ctx.beginPath();
            ctx.moveTo(jamStallPt.x + ox, 164);
            ctx.lineTo(jamStallPt.x + ox + 3, 158);
            ctx.lineTo(jamStallPt.x + ox + 6, 164);
            ctx.closePath();
            ctx.fill();
          });
        }

        // 5. Junction Node 44 (Decision Fork Marker)
        ctx.beginPath();
        ctx.arc(decisionPt.x, decisionPt.y, 8, 0, Math.PI * 2);
        ctx.fillStyle = "#0F172A";
        ctx.fill();
        ctx.strokeStyle = "#38BDF8";
        ctx.lineWidth = 2.5;
        ctx.stroke();

        // Node 44 Label & VMS Electronic Sign
        ctx.font = "bold 10px var(--font-mono)";
        ctx.fillStyle = "#38BDF8";
        ctx.fillText("NODE 44 (PVNR Split)", decisionPt.x - 48, decisionPt.y - 18);

        // VMS Gantry sign
        ctx.fillStyle = "#0B132B";
        ctx.fillRect(decisionPt.x - 70, decisionPt.y + 14, 140, 28);
        ctx.strokeStyle = "#1E293B";
        ctx.lineWidth = 1;
        ctx.strokeRect(decisionPt.x - 70, decisionPt.y + 14, 140, 28);
        ctx.font = "bold 8px var(--font-mono)";
        ctx.fillStyle = s.hasCongestionAhead ? "#EF4444" : "#34D399";
        ctx.fillText(s.hasCongestionAhead ? "VMS: PVNR RAMP BLOCKED" : "VMS: STRAIGHT ALL CLEAR", decisionPt.x - 64, decisionPt.y + 26);
        ctx.fillStyle = "#38BDF8";
        ctx.fillText("PILLAR 140 BYPASS ➔ 48 KM/H", decisionPt.x - 64, decisionPt.y + 37);

        // Start and End Destination Markers
        // Start: Mehdipatnam Inflow Gate
        ctx.beginPath();
        ctx.arc(startPt.x, startPt.y, 6, 0, Math.PI * 2);
        ctx.fillStyle = "#0284C7";
        ctx.fill();
        ctx.font = "bold 9px var(--font-sans)";
        ctx.fillStyle = "#E0F2FE";
        ctx.fillText("📍 ORIGIN: Mehdipatnam", startPt.x - 45, startPt.y - 12);

        // End: Destination Gate
        ctx.beginPath();
        ctx.arc(straightEndPt.x, straightEndPt.y, 6, 0, Math.PI * 2);
        ctx.fillStyle = "#10B981";
        ctx.fill();
        ctx.fillText("🏁 DESTINATION: Airport Hub", straightEndPt.x - 70, straightEndPt.y - 12);

        // Bypass Road Tag
        ctx.font = "bold 9.5px var(--font-sans)";
        ctx.fillStyle = "#34D399";
        ctx.fillText("🟢 Pillar 140 Service Arterial (Low Congestion Legal Bypass)", 380, 335);

        // 6. Draw User Vehicle Marker
        let userPos;
        let carHeadingAngle = 0;

        if (s.rerouteDecision === 'auto_bypass') {
          if (s.vehicleProgress <= 0.33) {
            // Before split
            const normT = s.vehicleProgress / 0.33;
            userPos = {
              x: startPt.x + (decisionPt.x - startPt.x) * normT,
              y: startPt.y + (decisionPt.y - startPt.y) * normT
            };
            carHeadingAngle = 0;
          } else {
            // After split on bypass
            const normT = (s.vehicleProgress - 0.33) / (1.0 - 0.33);
            userPos = getBypassPoint(normT);
            // Calculate tangent angle for car heading
            const deltaT = Math.min(1.0, normT + 0.02);
            const nextPos = getBypassPoint(deltaT);
            carHeadingAngle = Math.atan2(nextPos.y - userPos.y, nextPos.x - userPos.x);
          }
        } else {
          // Continues straight on main highway
          userPos = getStraightPoint(s.vehicleProgress);
          carHeadingAngle = 0;
        }

        // ── Render User Vehicle Marker ──
        ctx.save();
        ctx.translate(userPos.x, userPos.y);

        // Headlight cone beaming forward
        ctx.save();
        ctx.rotate(carHeadingAngle);
        const headLight = ctx.createRadialGradient(8, 0, 2, 45, 0, 30);
        headLight.addColorStop(0, "rgba(254, 240, 138, 0.65)");
        headLight.addColorStop(1, "rgba(254, 240, 138, 0.0)");
        ctx.beginPath();
        ctx.moveTo(8, -4);
        ctx.lineTo(45, -18);
        ctx.lineTo(45, 18);
        ctx.lineTo(8, 4);
        ctx.closePath();
        ctx.fillStyle = headLight;
        ctx.fill();
        ctx.restore();

        // Dynamic Radar Pulse Rings radiating from user vehicle
        const pulse = (frameCounter % 40) / 40;
        ctx.beginPath();
        ctx.arc(0, 0, 12 + pulse * 18, 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(6, 182, 212, ${1 - pulse})`;
        ctx.lineWidth = 1.5;
        ctx.stroke();

        // Car Body (Rotated to heading angle)
        ctx.save();
        ctx.rotate(carHeadingAngle);
        // Shadow
        ctx.fillStyle = "rgba(0, 0, 0, 0.6)";
        ctx.fillRect(-10, -5, 20, 12);
        // Metallic Cyan Body
        ctx.fillStyle = "#06B6D4";
        ctx.fillRect(-9, -6, 18, 12);
        ctx.strokeStyle = "#E0F2FE";
        ctx.lineWidth = 1;
        ctx.strokeRect(-9, -6, 18, 12);
        // Windshield
        ctx.fillStyle = "#0F172A";
        ctx.fillRect(0, -4, 4, 8);
        // Headlights
        ctx.fillStyle = "#FEF08A";
        ctx.fillRect(7, -5, 2, 3);
        ctx.fillRect(7, 2, 2, 3);
        // Taillights
        ctx.fillStyle = s.currentSpeedKmh < 20 ? "#EF4444" : "#F87171";
        ctx.fillRect(-9, -5, 2, 3);
        ctx.fillRect(-9, 2, 2, 3);
        ctx.restore();

        // Driver Indicator Badge above Vehicle
        ctx.fillStyle = "rgba(15, 23, 42, 0.9)";
        ctx.fillRect(-45, -34, 90, 18);
        ctx.strokeStyle = s.currentSpeedKmh < 20 ? "#EF4444" : "#38BDF8";
        ctx.lineWidth = 1;
        ctx.strokeRect(-45, -34, 90, 18);

        ctx.font = "bold 9px var(--font-sans)";
        ctx.fillStyle = "#E0F2FE";
        ctx.textAlign = "center";
        ctx.fillText(`YOU • ${s.currentSpeedKmh} km/h`, 0, -22);
        ctx.textAlign = "start";

        ctx.restore();

        // 7. Ambient Traffic Flow Particles on Open Lanes
        rerouteFlowParticles.forEach(p => {
          p.progress += p.speed;
          if (p.progress > 1.0) p.progress = 0;
          let pt;
          if (p.route === 'bypass') {
            pt = getBypassPoint(p.progress);
          } else {
            // If straight has congestion, stop ambient cars behind jam
            if (s.hasCongestionAhead && p.progress > 0.45 && p.progress < 0.8) {
              p.progress = 0.48; // queue up
            }
            pt = getStraightPoint(p.progress);
          }
          ctx.beginPath();
          ctx.arc(pt.x, pt.y + 3, p.size / 2, 0, Math.PI * 2);
          ctx.fillStyle = p.color;
          ctx.fill();
        });

        rerouteAnimId = requestAnimationFrame(renderSimulationFrame);
      }

      renderSimulationFrame();
    }

    // Mathematical Helpers for Geometry & Distance
    function getPointAlongPath(pts, t) {
      if (pts.length === 1) return pts[0];
      const totalSegs = pts.length - 1;
      const segIndex = Math.min(Math.floor(t * totalSegs), totalSegs - 1);
      const segT = (t * totalSegs) - segIndex;
      const p1 = pts[segIndex];
      const p2 = pts[segIndex + 1];
      return {
        x: p1.x + (p2.x - p1.x) * segT,
        y: p1.y + (p2.y - p1.y) * segT
      };
    }

    function distToSegment(p, v, w) {
      function sqr(x) { return x * x; }
      function dist2(v, w) { return sqr(v.x - w.x) + sqr(v.y - w.y); }
      const l2 = dist2(v, w);
      if (l2 === 0) return Math.sqrt(dist2(p, v));
      let t = ((p.x - v.x) * (w.x - v.x) + (p.y - v.y) * (w.y - v.y)) / l2;
      t = Math.max(0, Math.min(1, t));
      return Math.sqrt(dist2(p, { x: v.x + t * (w.x - v.x), y: v.y + t * (w.y - v.y) }));
    }

    function mapZoom(factor) {
      mapZoomScale = Math.max(0.7, Math.min(2.2, mapZoomScale * factor));
      showToast(`Map Zoom: ${Math.round(mapZoomScale * 100)}%`);
    }

    function resetMapView() {
      mapZoomScale = 1.0;
      mapPanX = 0;
      mapPanY = 0;
      showToast("Map view reset to default corridor framing.");
    }

    // ──── AUTOMATIC BOOTSTRAP ────
    // Ensures instant initialization on load without needing manual tab click
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', () => {
        render();
        initBackendData();
      });
    } else {
      render();
      initBackendData();
    }
  </script>
