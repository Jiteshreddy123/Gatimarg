<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GatiMarg AI — Urban Traffic Flow, Incident Intelligence & Festive Mobility Platform</title>
  <meta name="description"
    content="GatiMarg AI: An AI-driven traffic management, multi-horizon forecasting, spillback tracking, and cultural event mobility platform engineered for Hyderabad metropolitan corridors.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;600&display=swap"
    rel="stylesheet">
  <style>
    /* =========================================================================
       GATIMARG AI — DESIGN SYSTEM (Sleek Urban Command Dark / Slate Palette)
       ========================================================================= */
    :root {
      /* Backgrounds & Surfaces */
      --bg-dark: #090D16;
      --bg-card: #0F172A;
      --bg-card-hover: #162238;
      --surface-subtle: #1E293B;
      --surface-border: #334155;
      --border-bright: #475569;

      /* Text Colors */
      --text-main: #F8FAFC;
      --text-secondary: #94A3B8;
      --text-muted: #64748B;

      /* Primary Brand / Flow: Electric Cyan & Tech Indigo */
      --brand-primary: #06B6D4;
      --brand-glow: rgba(6, 182, 212, 0.25);
      --brand-accent: #3B82F6;
      --brand-dark: #0E7490;

      /* Festive & Amber Shocks */
      --festive-gold: #F59E0B;
      --festive-glow: rgba(245, 158, 11, 0.22);
      --festive-bg: #451A03;
      --festive-border: #B45309;

      /* Status Colors */
      --status-green: #10B981;
      --status-red: #EF4444;
      --status-yellow: #EAB308;
      --status-purple: #8B5CF6;

      /* Radii & Shadows */
      --r-sm: 6px;
      --r-md: 12px;
      --r-lg: 18px;
      --r-full: 9999px;
      --shadow-card: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);

      /* Typography */
      --font-sans: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      --font-display: 'Space Grotesk', system-ui, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: var(--font-sans);
      background-color: var(--bg-dark);
      color: var(--text-main);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      min-height: 100vh;
    }

    h1,
    h2,
    h3,
    h4 {
      font-family: var(--font-display);
      letter-spacing: -0.02em;
    }

    /* ---- TOP SYSTEM BAR ---- */
    .system-bar {
      background: #050811;
      border-bottom: 1px solid var(--surface-border);
      padding: 6px 24px;
      font-size: 11px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--text-secondary);
      flex-wrap: wrap;
      gap: 8px;
    }

    .badge-live {
      background: rgba(16, 185, 129, 0.15);
      color: #34D399;
      border: 1px solid rgba(16, 185, 129, 0.3);
      padding: 2px 8px;
      border-radius: var(--r-full);
      font-weight: 700;
      font-size: 10px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .pulse-dot {
      width: 6px;
      height: 6px;
      background: #10B981;
      border-radius: 50%;
      box-shadow: 0 0 8px #10B981;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(1.3); }
    }

    /* ---- APP HEADER ---- */
    .app-header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--surface-border);
      padding: 0 24px;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .logo-container {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
    }

    .logo-badge {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: linear-gradient(135deg, #06B6D4, #3B82F6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      box-shadow: 0 0 16px var(--brand-glow);
    }

    .logo-title {
      font-family: var(--font-display);
      font-size: 20px;
      font-weight: 700;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .logo-title span {
      font-size: 10px;
      background: rgba(6, 182, 212, 0.2);
      color: #38BDF8;
      border: 1px solid rgba(6, 182, 212, 0.4);
      padding: 2px 6px;
      border-radius: 4px;
      font-family: var(--font-mono);
      font-weight: 600;
    }

    .logo-sub {
      font-size: 11px;
      color: var(--text-secondary);
    }

    /* Portal Tabs */
    .nav-tabs {
      display: flex;
      background: #090D16;
      border: 1px solid var(--surface-border);
      border-radius: var(--r-full);
      padding: 3px;
      gap: 2px;
    }

    .nav-tab {
      padding: 6px 14px;
      border-radius: var(--r-full);
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
      border: none;
      background: none;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .nav-tab:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.05);
    }

    .nav-tab.active {
      background: linear-gradient(135deg, #0284C7, #06B6D4);
      color: #fff;
      box-shadow: 0 2px 10px rgba(6, 182, 212, 0.3);
    }

    /* ---- BUTTONS ---- */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      border-radius: var(--r-full);
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      border: 1px solid transparent;
      text-decoration: none;
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn-brand {
      background: linear-gradient(135deg, #0284C7, #06B6D4);
      color: #fff;
      box-shadow: 0 2px 12px var(--brand-glow);
    }

    .btn-brand:hover {
      box-shadow: 0 4px 18px rgba(6, 182, 212, 0.45);
      filter: brightness(1.1);
    }

    .btn-festive {
      background: linear-gradient(135deg, #B45309, #F59E0B);
      color: #fff;
      box-shadow: 0 2px 12px var(--festive-glow);
    }

    .btn-outline {
      background: transparent;
      border-color: var(--surface-border);
      color: var(--text-main);
    }

    .btn-outline:hover {
      background: var(--surface-subtle);
      border-color: var(--brand-primary);
    }

    .btn-danger {
      background: rgba(239, 68, 68, 0.18);
      border-color: rgba(239, 68, 68, 0.4);
      color: #F87171;
    }

    .btn-danger:hover {
      background: #EF4444;
      color: #fff;
    }

    .btn-sm {
      padding: 5px 12px;
      font-size: 11px;
    }

    /* ---- CARDS & LAYOUT ---- */
    .main-container {
      max-width: 1280px;
      margin: 0 auto;
      padding: 24px 20px 60px;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--surface-border);
      border-radius: var(--r-md);
      padding: 20px;
      box-shadow: var(--shadow-card);
      transition: border-color 0.2s;
    }

    .card:hover {
      border-color: var(--border-bright);
    }

    .card-festive {
      border-color: var(--festive-border);
      background: linear-gradient(145deg, #1C1306 0%, var(--bg-card) 100%);
    }

    .grid-2 {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }

    .grid-4 {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
    }

    /* Metric Cards */
    .stat-box {
      background: #090E1D;
      border: 1px solid var(--surface-border);
      border-radius: var(--r-sm);
      padding: 14px;
    }

    .stat-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 4px;
    }

    .stat-value {
      font-family: var(--font-display);
      font-size: 24px;
      font-weight: 700;
      color: #fff;
    }

    .stat-sub {
      font-size: 11px;
      color: var(--text-secondary);
      margin-top: 2px;
    }

    /* Realistic Cartographic GIS Canvas */
    .corridor-canvas {
      width: 100%;
      height: 460px;
      background: #080D1A;
      border: 1px solid var(--surface-border);
      border-radius: var(--r-md);
      position: relative;
      overflow: hidden;
      box-shadow: inset 0 0 35px rgba(0, 0, 0, 0.7);
    }

    #hyderabadMapCanvas {
      width: 100%;
      height: 100%;
      display: block;
      cursor: crosshair;
    }

    .map-hud-tooltip {
      position: absolute;
      background: rgba(15, 23, 42, 0.95);
      border: 1.5px solid #06B6D4;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.7), 0 0 16px rgba(6, 182, 212, 0.35);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 11.5px;
      color: #fff;
      pointer-events: none;
      z-index: 50;
      display: none;
      transform: translate(-50%, -125%);
      white-space: nowrap;
      backdrop-filter: blur(10px);
    }

    .map-controls-panel {
      position: absolute;
      top: 12px;
      right: 12px;
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(8px);
      border: 1px solid var(--surface-border);
      border-radius: 8px;
      padding: 6px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      z-index: 30;
    }

    .map-btn {
      background: var(--surface-subtle);
      border: 1px solid var(--surface-border);
      color: var(--text-main);
      width: 32px;
      height: 32px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.15s;
    }

    .map-btn:hover {
      background: #0284C7;
      color: #fff;
      border-color: #38BDF8;
    }

    .map-legend-bar {
      position: absolute;
      bottom: 12px;
      left: 12px;
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(8px);
      border: 1px solid var(--surface-border);
      border-radius: 8px;
      padding: 7px 12px;
      font-size: 10.5px;
      display: flex;
      align-items: center;
      gap: 12px;
      z-index: 30;
      flex-wrap: wrap;
    }

    .map-compass-box {
      position: absolute;
      bottom: 12px;
      right: 12px;
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(8px);
      border: 1px solid var(--surface-border);
      border-radius: 8px;
      padding: 5px 10px;
      font-size: 10px;
      color: var(--text-muted);
      z-index: 30;
      text-align: right;
    }

    /* Commuter Phone Simulator */
    .phone-frame {
      width: 380px;
      height: 720px;
      background: #030712;
      border-radius: 44px;
      border: 8px solid #1E293B;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    .phone-notch {
      width: 120px;
      height: 20px;
      background: #1E293B;
      border-bottom-left-radius: 14px;
      border-bottom-right-radius: 14px;
      margin: 0 auto;
      z-index: 30;
    }

    .phone-body {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      color: #fff;
    }

    /* Tables */
    .table-container {
      overflow-x: auto;
      width: 100%;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12.5px;
      text-align: left;
    }

    th {
      background: #0B1120;
      padding: 10px 14px;
      color: var(--text-muted);
      font-weight: 600;
      text-transform: uppercase;
      font-size: 10.5px;
      letter-spacing: 0.05em;
      border-bottom: 1px solid var(--surface-border);
    }

    td {
      padding: 12px 14px;
      border-bottom: 1px solid rgba(51, 65, 85, 0.5);
    }

    tr:hover td {
      background: rgba(255, 255, 255, 0.02);
    }

    /* Modals */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(3, 7, 18, 0.75);
      backdrop-filter: blur(8px);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-content {
      background: var(--bg-card);
      border: 1px solid var(--surface-border);
      border-radius: var(--r-md);
      max-width: 600px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      padding: 24px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
    }

    .modal-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .close-btn {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: var(--surface-subtle);
      border: 1px solid var(--surface-border);
      color: var(--text-secondary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .close-btn:hover {
      color: #fff;
      background: var(--surface-border);
    }

    /* Notification Toast */
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #0E7490;
      color: #fff;
      padding: 12px 20px;
      border-radius: var(--r-md);
      border: 1px solid #06B6D4;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      font-size: 13px;
      font-weight: 600;
      z-index: 200;
      display: flex;
      align-items: center;
      gap: 10px;
      animation: slideUp 0.3s ease;
    }

    @keyframes slideUp {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    /* Responsive */
    @media (max-width: 900px) {
      .grid-4 { grid-template-columns: repeat(2, 1fr); }
      .grid-3 { grid-template-columns: 1fr; }
      .grid-2 { grid-template-columns: 1fr; }
      .app-header { height: auto; padding: 12px 16px; flex-wrap: wrap; }
      .nav-tabs { overflow-x: auto; max-width: 100%; }
    }
  </style>
</head>

<body>

  <!-- ===== 1. HEADER & NAVIGATION ===== -->
  <header class="app-header">
    <div class="logo-container" onclick="switchView('dashboard')">
      <div class="logo-badge">⚡</div>
      <div>
        <div class="logo-title">
          GatiMarg AI
          <span>NEURAX 3.0</span>
        </div>
        <div class="logo-sub">Urban Traffic Flow, Incident Intelligence &amp; Festive Mobility</div>
      </div>
    </div>

    <!-- Navigation Tabs -->
    <nav class="nav-tabs">
      <button class="nav-tab active" id="tab-dashboard" onclick="switchView('dashboard')">📊 Command Center</button>
      <button class="nav-tab" id="tab-incidents" onclick="switchView('incidents')">🚨 Incident Radar</button>
      <button class="nav-tab" id="tab-festive" onclick="switchView('festive')">🪔 Jan-Vani (Festive Gate)</button>
      <button class="nav-tab" id="tab-commuter" onclick="switchView('commuter')">📱 Commuter Pass</button>
      <button class="nav-tab" id="tab-audit" onclick="switchView('audit')">🛡️ Hygiene &amp; Audit</button>
    </nav>

    <div style="display: flex; align-items: center; gap: 10px;">
      <button class="btn btn-brand btn-sm" onclick="openSimulateIncidentModal()">+ Simulate Incident</button>
    </div>
  </header>

  <!-- ===== MAIN VIEWPORT (DYNAMICALLY SWITCHED) ===== -->
  <main class="main-container" id="mainViewport">
    <!-- Rendered via JavaScript -->
  </main>

  <!-- ===== 5. MODAL CONTAINER ===== -->
  <div id="modalRoot"></div>

  <!-- ===== 6. JAVASCRIPT ENGINE ===== -->
  <script>
    /* =========================================================================
       GATIMARG AI — INTERACTIVE STATE & APPLICATION ENGINE
       ========================================================================= */

    const STATE = {
      currentView: 'dashboard',
      simulatedWeather: 'clear', // clear | monsoon_rain
      activeFilter: 'all',

      // Network Overview
      network: {
        totalSegments: 436,
        totalNodes: 120,
        cleanedReadings: 4320,
        stuckSensorsRepaired: 84,
        negativeSpeedsClamped: 112,
        spikesSmoothed: 67
      },

      // Corridors & Segments State
      segments: [
        { id: "SEG-042", name: "PVNR Expressway Ramp (Mehdipatnam Exit)", capacity: 2400, freeFlowSpeed: 65, currentSpeed: 18, flow: 2310, status: "congested", shockwaveRisk: "high", festivalImpact: "normal" },
        { id: "SEG-118", name: "Gachibowli Outer Ring Road Feeder", capacity: 3200, freeFlowSpeed: 80, currentSpeed: 74, flow: 1850, status: "smooth", shockwaveRisk: "low", festivalImpact: "normal" },
        { id: "SEG-089", name: "HITEC City Cyber Towers Junction", capacity: 2800, freeFlowSpeed: 50, currentSpeed: 24, flow: 2680, status: "moderate", shockwaveRisk: "medium", festivalImpact: "normal" },
        { id: "SEG-205", name: "Tank Bund / Hussain Sagar Arterial", capacity: 2200, freeFlowSpeed: 45, currentSpeed: 6, flow: 450, status: "festive-blocked", shockwaveRisk: "critical", festivalImpact: "severe_barricade" },
        { id: "SEG-206", name: "NTR Marg - Secretariat Bypass", capacity: 2000, freeFlowSpeed: 45, currentSpeed: 8, flow: 520, status: "festive-blocked", shockwaveRisk: "critical", festivalImpact: "severe_barricade" },
        { id: "SEG-301", name: "Secunderabad Station Road (Lashkar Bonalu Route)", capacity: 1800, freeFlowSpeed: 40, currentSpeed: 12, flow: 800, status: "festive-blocked", shockwaveRisk: "high", festivalImpact: "procession_cordon" },
        { id: "SEG-150", name: "Necklace Road Alternate Diversion Loop", capacity: 1900, freeFlowSpeed: 50, currentSpeed: 42, flow: 1400, status: "diversion", shockwaveRisk: "low", festivalImpact: "open_bypass" }
      ],

      // Active Incidents
      incidents: [
        {
          id: "INC-901",
          segmentId: "SEG-042",
          title: "Stalled Heavy Transit Bus at Mehdipatnam Exit Ramp",
          detectedAt: "10 mins ago",
          confidence: "98.4%",
          queueLengthKm: 1.85,
          shockwaveVelocityKmh: -14.2, // Upstream propagation
          upstreamThreats: ["SEG-041 (Airport Flyover)", "SEG-039 (Attapur Inflow)"],
          recommendedDiversion: "Divert light motor vehicles to Pillar 140 underpass slip road (Avoids turning prohibition at Node 44)."
        }
      ],

      // Festive Events (Telangana Mobility)
      festiveEvents: [
        {
          name: "Vinayaka Chavithi Maha Nimajjanam",
          location: "Hussain Sagar / Tank Bund Convergence",
          details: "Thousands of idol immersion processions converging from Old City, Secunderabad, and Cyberabad.",
          status: "Active Barricades In Effect",
          estimatedCrowdMultiplier: "5.8x Normal Density",
          blockedRoads: ["Tank Bund Arterial (SEG-205)", "NTR Marg Corridor (SEG-206)"],
          bypassRoute: "Necklace Road - Lower Tank Bund Bypass Link (SEG-150)",
          commutersNotifiedPrior: 14200
        },
        {
          name: "Lashkar Bonalu Jatara",
          location: "Secunderabad (Ujjaini Mahakali Temple)",
          details: "Ceremonial procession blockades and pedestrian surges.",
          status: "Phase-Wise Cordons",
          estimatedCrowdMultiplier: "4.2x Normal Density",
          blockedRoads: ["Secunderabad Station Road (SEG-301)"],
          bypassRoute: "MG Road Arterial Flyover Link",
          commutersNotifiedPrior: 8600
        }
      ],

      // Crowdsourced Reports ("Jan-Vani")
      crowdReports: [
        { id: "JV-101", ward: "Khairatabad Ward 91", text: "Heavy 15-meter immersion truck moving slow near IMAX circle. Arterial lane completely blocked.", votes: 42, verified: true, time: "8 mins ago" },
        { id: "JV-102", ward: "Ranigunj Ward 78", text: "Police barricade deployed at Bible House junction. Diverting all four-wheelers towards RP Road.", votes: 29, verified: true, time: "14 mins ago" },
        { id: "JV-103", ward: "Begumpet Ward 82", text: "Pooja pandal queue extending 200 meters onto left carriageway.", votes: 16, verified: true, time: "22 mins ago" }
      ]
    };

    // ──── RENDER ENGINE ────
    function render() {
      const root = document.getElementById('mainViewport');
      document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
      const activeTab = document.getElementById(`tab-${STATE.currentView}`);
      if (activeTab) activeTab.classList.add('active');

      switch (STATE.currentView) {
        case 'dashboard':
          root.innerHTML = renderDashboardView();
          setTimeout(initRealisticHyderabadMap, 40);
          break;
        case 'incidents':
          root.innerHTML = renderIncidentView();
          break;
        case 'festive':
          root.innerHTML = renderFestiveView();
          break;
        case 'commuter':
          root.innerHTML = renderCommuterView();
          break;
        case 'audit':
          root.innerHTML = renderAuditView();
          break;
        default:
          root.innerHTML = renderDashboardView();
      }
    }

    function switchView(viewName) {
      STATE.currentView = viewName;
      render();
    }

    // ──── 1. COMMAND CENTER DASHBOARD VIEW ────
    function renderDashboardView() {
      const n = STATE.network;
      return `
        <!-- Top Metrics Row -->
        <div class="grid-4" style="margin-bottom: 20px;">
          <div class="stat-box">

    function initRealisticHyderabadMap() {
      const canvas = document.getElementById('hyderabadMapCanvas');
      if (!canvas) return;

      const ctx = canvas.getContext('2d');
      const container = document.getElementById('corridorMapContainer');
      const tooltip = document.getElementById('mapTooltip');

      // Adjust canvas resolution
      const rect = container.getBoundingClientRect();
      canvas.width = rect.width || 760;
      canvas.height = rect.height || 460;

      // Spawn initial vehicle particles
      mapParticles = [];
      for (let i = 0; i < 90; i++) {
        const cIdx = Math.floor(Math.random() * MAP_CORRIDORS.length);
        mapParticles.push({
          corridorIndex: cIdx,
          progress: Math.random(),
          speedMultiplier: 0.8 + Math.random() * 0.4
        });
      }

      // Spawn rain drops
      mapRainDrops = [];
      for (let i = 0; i < 120; i++) {
        mapRainDrops.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          len: 10 + Math.random() * 12,
          speed: 8 + Math.random() * 6
        });
      }

      // Mouse interactivity for hover HUD
      canvas.onmousemove = function(e) {
        const cRect = canvas.getBoundingClientRect();
        const mx = (e.clientX - cRect.left - mapPanX) / mapZoomScale;
        const my = (e.clientY - cRect.top - mapPanY) / mapZoomScale;

        let closestSeg = null;
        let minDist = 20; // 20px detection threshold

        MAP_CORRIDORS.forEach(c => {
          for (let i = 0; i < c.points.length - 1; i++) {
            const p1 = c.points[i];
            const p2 = c.points[i + 1];
            const d = distToSegment({x: mx, y: my}, p1, p2);
            if (d < minDist) {
              minDist = d;
              closestSeg = c;
            }
          }
        });

        hoveredSegment = closestSeg;

        if (closestSeg && tooltip) {
          tooltip.style.display = 'block';
          tooltip.style.left = (e.clientX - cRect.left) + 'px';
          tooltip.style.top = (e.clientY - cRect.top) + 'px';

          document.getElementById('ttTitle').textContent = closestSeg.name;
          document.getElementById('ttSub').textContent = `Segment ID: ${closestSeg.id} · Priority Link`;
          
          let statBadge = '';
          if (closestSeg.status === 'congested') statBadge = '<span style="color: #F87171;">⚠️ Gridlocked: Stalled Transit Bus</span>';
          else if (closestSeg.status === 'shockwave') statBadge = '<span style="color: #F59E0B;">⚡ Upstream Spillback Shockwave (-14.2 km/h)</span>';
          else if (closestSeg.status === 'festive-blocked') statBadge = '<span style="color: #EF4444;">🪔 Festive Cordon (Procession Barricade)</span>';
          else if (closestSeg.status === 'diversion') statBadge = '<span style="color: #34D399;">✓ Active Legal Bypass (Recommended)</span>';
          else statBadge = '<span style="color: #34D399;">✓ Fluid Traffic Flow</span>';

          document.getElementById('ttMetrics').innerHTML = `
            Live Speed: <strong>${closestSeg.speed} km/h</strong> (Free: ${closestSeg.freeSpeed} km/h)<br>
            Discharge Flow: <strong>${closestSeg.flow.toLocaleString()} vph</strong> (Cap: ${closestSeg.cap.toLocaleString()} vph)<br>
            ${statBadge}<br>
            <span style="color: #38BDF8; font-size: 10px; font-weight: 600;">[Click road to inspect segment telemetry]</span>
          `;
        } else if (tooltip) {
          tooltip.style.display = 'none';
        }
      };

      canvas.onmouseleave = function() {
        hoveredSegment = null;
        if (tooltip) tooltip.style.display = 'none';
      };

      canvas.onclick = function() {
        if (hoveredSegment) {
          viewSegmentDetails(hoveredSegment.id);
        }
      };

      // Start 60fps render loop
      if (mapAnimId) cancelAnimationFrame(mapAnimId);

      function loop() {
        if (STATE.currentView !== 'dashboard') return;
        drawRealisticMap(canvas, ctx);
        mapAnimId = requestAnimationFrame(loop);
      }
      loop();
    }

    function drawRealisticMap(canvas, ctx) {
      const W = canvas.width;
      const H = canvas.height;

      ctx.clearRect(0, 0, W, H);
      ctx.save();
      ctx.translate(mapPanX, mapPanY);
      ctx.scale(mapZoomScale, mapZoomScale);

      // 1. Background Cartographic Grid
      ctx.strokeStyle = "rgba(30, 41, 59, 0.45)";
      ctx.lineWidth = 0.6;
      for (let x = 0; x < W + 200; x += 45) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, H + 200);
        ctx.stroke();
      }
      for (let y = 0; y < H + 200; y += 45) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(W + 200, y);
        ctx.stroke();
      }

      // 2. Water Bodies (Hussain Sagar, Durgam Cheruvu, Musi River)
      // Musi River (meandering across south)
      ctx.beginPath();
      ctx.moveTo(20, 395);
      ctx.bezierCurveTo(160, 420, 300, 385, 430, 410);
      ctx.bezierCurveTo(570, 435, 680, 400, 760, 410);
      ctx.strokeStyle = "#0B2844";
      ctx.lineWidth = 14;
      ctx.lineCap = "round";
      ctx.stroke();

      ctx.font = "italic 9px var(--font-sans)";
      ctx.fillStyle = "rgba(56, 189, 248, 0.35)";
      ctx.fillText("Musi River Corridor", 230, 403);

      // Durgam Cheruvu Lake (west)
      ctx.beginPath();
      ctx.ellipse(145, 205, 38, 18, -0.25, 0, Math.PI * 2);
      ctx.fillStyle = "#0C2339";
      ctx.fill();
      ctx.strokeStyle = "#0284C7";
      ctx.lineWidth = 1.2;
      ctx.stroke();
      ctx.fillText("Durgam Cheruvu", 115, 208);

      // Hussain Sagar Lake (organic heart polygon with glowing shoreline)
      ctx.beginPath();
      ctx.moveTo(415, 175);
      ctx.bezierCurveTo(445, 135, 505, 145, 525, 185);
      ctx.bezierCurveTo(540, 225, 515, 270, 470, 275);
      ctx.bezierCurveTo(430, 280, 400, 240, 415, 175);
      ctx.closePath();
      ctx.fillStyle = "#0D2B48";
      ctx.fill();
      ctx.strokeStyle = "rgba(6, 182, 212, 0.5)";
      ctx.lineWidth = 2;
      ctx.stroke();

      // Buddha Statue Marker in center of Hussain Sagar
      ctx.beginPath();
      ctx.arc(468, 208, 4, 0, Math.PI * 2);
      ctx.fillStyle = "#FDE047";
      ctx.fill();
      ctx.font = "bold 9.5px var(--font-sans)";
      ctx.fillStyle = "#E0F2FE";
      ctx.fillText("Hussain Sagar Lake", 432, 224);
      ctx.font = "8px var(--font-sans)";
      ctx.fillStyle = "#FDE047";
      ctx.fillText("● Buddha Statue", 438, 235);

      // 3. Green Open Spaces (KBR Park, Lumbini Park)
      ctx.beginPath();
      ctx.ellipse(195, 245, 24, 16, 0.2, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(5, 150, 105, 0.15)";
      ctx.fill();
      ctx.strokeStyle = "rgba(5, 150, 105, 0.35)";
      ctx.stroke();
      ctx.fillStyle = "rgba(52, 211, 153, 0.4)";
      ctx.fillText("KBR Park", 175, 248);

      // 4. Render All Road Corridors
      MAP_CORRIDORS.forEach(c => {
        const isHov = hoveredSegment && hoveredSegment.id === c.id;

        // Hover halo
        if (isHov) {
          ctx.beginPath();
          ctx.moveTo(c.points[0].x, c.points[0].y);
          for (let i = 1; i < c.points.length; i++) ctx.lineTo(c.points[i].x, c.points[i].y);
          ctx.strokeStyle = "rgba(6, 182, 212, 0.5)";
          ctx.lineWidth = c.width + 8;
          ctx.lineCap = "round";
          ctx.lineJoin = "round";
          ctx.stroke();
        }

        // Road base / casing
        ctx.beginPath();
        ctx.moveTo(c.points[0].x, c.points[0].y);
        for (let i = 1; i < c.points.length; i++) ctx.lineTo(c.points[i].x, c.points[i].y);
        ctx.strokeStyle = isHov ? "#fff" : c.color;
        ctx.lineWidth = isHov ? c.width + 1.5 : c.width;
        ctx.lineCap = "round";
        ctx.lineJoin = "round";

        // Striped hazard line for festive cordons
        if (c.isStriped) {
          ctx.setLineDash([8, 6]);
        } else {
          ctx.setLineDash([]);
        }
        ctx.stroke();
        ctx.setLineDash([]); // Reset dash

        // Draw Incident Marker on PVNR
        if (c.hasIncident && c.incidentPoint) {
          const now = Date.now() / 300;
          const pulseR = 7 + Math.sin(now) * 3;
          ctx.beginPath();
          ctx.arc(c.incidentPoint.x, c.incidentPoint.y, pulseR, 0, Math.PI * 2);
          ctx.fillStyle = "rgba(239, 68, 68, 0.35)";
          ctx.fill();

          ctx.beginPath();
          ctx.arc(c.incidentPoint.x, c.incidentPoint.y, 4, 0, Math.PI * 2);
          ctx.fillStyle = "#EF4444";
          ctx.fill();
          ctx.strokeStyle = "#fff";
          ctx.lineWidth = 1;
          ctx.stroke();

          ctx.font = "bold 9px var(--font-sans)";
          ctx.fillStyle = "#F87171";
          ctx.fillText("🚨 STALL (PVNR Ramp)", c.incidentPoint.x + 8, c.incidentPoint.y - 4);
        }

        // Draw Shockwave Propagation Wave
        if (c.hasShockwave) {
          const wavePhase = (Date.now() / 400) % 1;
          const waveP = getPointAlongPath(c.points, wavePhase);
          ctx.beginPath();
          ctx.arc(waveP.x, waveP.y, 5, 0, Math.PI * 2);
          ctx.fillStyle = "rgba(245, 158, 11, 0.8)";
          ctx.fill();
        }

        // Draw Directional Chevrons on Recommended Bypass
        if (c.isDiversion) {
          const divP = getPointAlongPath(c.points, (Date.now() / 800) % 1);
          ctx.beginPath();
          ctx.arc(divP.x, divP.y, 4, 0, Math.PI * 2);
          ctx.fillStyle = "#34D399";
          ctx.fill();
        }
      });

      // 5. Update & Render Moving Vehicle Particles
      mapParticles.forEach(p => {
        const corridor = MAP_CORRIDORS[p.corridorIndex];
        if (!corridor) return;

        // Effective speed along path
        let baseStep = 0.003 * p.speedMultiplier;
        if (corridor.status === 'congested') baseStep = 0.0008;
        if (corridor.status === 'festive-blocked') baseStep = 0.0003;
        if (STATE.simulatedWeather === 'monsoon_rain') baseStep *= 0.75;

        p.progress += baseStep;
        if (p.progress >= 1) p.progress = 0;

        const pt = getPointAlongPath(corridor.points, p.progress);

        ctx.beginPath();
        ctx.arc(pt.x, pt.y, 2.2, 0, Math.PI * 2);

        // Particle color
        if (corridor.status === 'congested') ctx.fillStyle = "#FCA5A5";
        else if (corridor.status === 'festive-blocked') ctx.fillStyle = "#F87171";
        else if (corridor.status === 'shockwave') ctx.fillStyle = "#FDE68A";
        else if (corridor.status === 'diversion') ctx.fillStyle = "#6EE7B7";
        else ctx.fillStyle = "#E0F2FE";

        ctx.fill();
      });

      // 6. Draw Key Junction Nodes
      const JUNC_NODES = [
        { name: "N44", x: 280, y: 300 },
        { name: "N12", x: 45, y: 140 },
        { name: "N89", x: 460, y: 275 },
        { name: "N90", x: 500, y: 155 },
        { name: "N102", x: 380, y: 270 },
        { name: "N77", x: 545, y: 105 }
      ];
      JUNC_NODES.forEach(jn => {
        ctx.beginPath();
        ctx.arc(jn.x, jn.y, 3.5, 0, Math.PI * 2);
        ctx.fillStyle = "#0F172A";
        ctx.fill();
        ctx.strokeStyle = "#38BDF8";
        ctx.lineWidth = 1.5;
        ctx.stroke();

        ctx.font = "600 8px var(--font-mono)";
        ctx.fillStyle = "rgba(148, 163, 184, 0.75)";
        ctx.fillText(jn.name, jn.x - 7, jn.y - 6);
      });

      // 7. Geographic Landmarks Text
      ctx.font = "bold 9px var(--font-sans)";
      ctx.fillStyle = "rgba(226, 232, 240, 0.65)";
      MAP_LANDMARKS.forEach(lm => {
        ctx.fillText(lm.name, lm.x, lm.y);
      });

      // 8. Monsoon Rain Overlay Animation (if toggled)
      if (STATE.simulatedWeather === 'monsoon_rain') {
        ctx.strokeStyle = "rgba(186, 230, 253, 0.35)";
        ctx.lineWidth = 1;
        mapRainDrops.forEach(r => {
          ctx.beginPath();
          ctx.moveTo(r.x, r.y);
          ctx.lineTo(r.x - 3, r.y + r.len);
          ctx.stroke();
          r.y += r.speed;
          r.x -= 1.5;
          if (r.y > H) {
            r.y = -10;
            r.x = Math.random() * W;
          }
        });
      }

      ctx.restore();
    }

    // Mathematical Helpers for Geometry & Distance
    function getPointAlongPath(pts, t) {
      if (pts.length === 1) return pts[0];
      const totalSegs = pts.length - 1;
      const segIndex = Math.min(Math.floor(t * totalSegs), totalSegs - 1);
      const segT = (t * totalSegs) - segIndex;
      const p1 = pts[segIndex];
      const p2 = pts[segIndex + 1];
      return {
        x: p1.x + (p2.x - p1.x) * segT,
        y: p1.y + (p2.y - p1.y) * segT
      };
    }

    function distToSegment(p, v, w) {
      function sqr(x) { return x * x; }
      function dist2(v, w) { return sqr(v.x - w.x) + sqr(v.y - w.y); }
      const l2 = dist2(v, w);
      if (l2 === 0) return Math.sqrt(dist2(p, v));
      let t = ((p.x - v.x) * (w.x - v.x) + (p.y - v.y) * (w.y - v.y)) / l2;
      t = Math.max(0, Math.min(1, t));
      return Math.sqrt(dist2(p, { x: v.x + t * (w.x - v.x), y: v.y + t * (w.y - v.y) }));
    }

    function mapZoom(factor) {
      mapZoomScale = Math.max(0.7, Math.min(2.2, mapZoomScale * factor));
      showToast(`Map Zoom: ${Math.round(mapZoomScale * 100)}%`);
    }

    function resetMapView() {
      mapZoomScale = 1.0;
      mapPanX = 0;
      mapPanY = 0;
      showToast("Map view reset to default corridor framing.");
    }
  </script>
